<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <!-- http://getbootstrap.com/docs/5.3/ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" type="text/css" href="../styles.css">
    <link rel="stylesheet" type="text/css" href="./styles.css">

    <title>Upload - Scratch Arcade</title>
</head>
<body>


    <p id="sub-title">Put your scratch game on the</p>
    <h1 id="title">Scratch Arcade!</h1>

    <div id='container'>
        
        <div id='instructions-container'>
            <h2>Instructions:</h2>
            <div id="instructions-items-container">
            </div>
        </div>

        <div id='upload-container'>

            <h2>Upload your game:</h2>
            <p id='errors'></p>
            <input type="text" id="name" placeholder="Game name" autocomplete="off" autofocus/>
            <input type="text" id="link" placeholder="Game link" autocomplete="off"/>
            <label for="png" class="drop-container">
                <span class="drop-title">Drop PNG file here</span>
                or
                <input type="file" id="png" accept=".png" required>
            </label>
            <button id="submit">Upload</button>
        </div>

    </div>

    <script>
        
        for (const i of document.querySelectorAll('.drop-container')) {
            const dropContainer = i;
            const fileInput = document.getElementById(i.getAttribute("for"));

            dropContainer.addEventListener("dragover", (e) => {
                // prevent default to allow drop
                e.preventDefault()
            }, false)

            dropContainer.addEventListener("dragenter", () => {
                dropContainer.classList.add("drag-active")
            })

            dropContainer.addEventListener("dragleave", () => {
                dropContainer.classList.remove("drag-active")
            })

            dropContainer.addEventListener("drop", (e) => {
                e.preventDefault()
                dropContainer.classList.remove("drag-active")

                const extName = e.dataTransfer.files[0].name.split('.').pop();
                if (('.' + extName) === fileInput.getAttribute('accept')) fileInput.files = e.dataTransfer.files;
                
            })
        }
        
    </script>

    <script>
        function submitFiles () {
            const formData = new FormData();

            const name = document.querySelector('#name');
            const link = document.querySelector('#link');
            const png = document.querySelector('#png');

            formData.append('name', name.value);
            formData.append('link', link.value);
            formData.append('png', png.files[0]);

            const options = {
                method: 'POST',
                body: formData,
            }

            fetch('/api/upload-link', options).then(response => response.json()).then(dat => {
                const display = document.querySelector('#errors');
                display.style.display = 'block';
                if (dat.errors) {
                    display.innerHTML = '<h3>Failure</h3>' + '- ' + dat.errors.join('<br>- ');
                } else {
                    for (const i of document.querySelectorAll('input')) i.value = null;
                    display.innerHTML = '<h3>Success!</h3> <a href="/arcade">click here to preview arcade</a>';
                }
            });
        }

        document.querySelector('#submit').addEventListener('click', submitFiles);
    </script>
</body>

</html>
