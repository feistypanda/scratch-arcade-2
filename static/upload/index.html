<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <link rel="stylesheet" type="text/css" href="../styles.css">
    <link rel="stylesheet" type="text/css" href="./styles.css">

    <title>Upload - Scratch Arcade</title>
</head>
<body>


    <p id="sub-title">Put your scratch maze game on the</p>
    <h1 id="title">Scratch Arcade!</h1>

    <h2>SELECT YOUR GAME FOLDER:<h2>

    <div>
        <input type="text" id="name" placeholder="game name" autocomplete="off" autofocus/>
        <input type="file" id="html"/>
        <input type="file" id="png"/>
        <input type="file" id="sb3"/>
        <button id="submit">submit</button>
    </div>

    <h2 id="instructions-title">Instructions:</h2>

    <script>
        function submitFiles () {
            const formData = new FormData();

            const name = document.querySelector('#name');

            const files = {
                html: document.querySelector('#html'),
                png: document.querySelector('#png'),
                sb3: document.querySelector('#sb3'),
            }

            formData.append('name', name.value);
            for (const i in files) formData.append(i, files[i].files[0])

            const options = {
                method: 'POST',
                body: formData,
            }

            fetch('/api/upload', options).then(response => response.json()).then(dat => console.log(dat));
        }

        document.querySelector('#submit').addEventListener('click', submitFiles);
    </script>
</body>

</html>
