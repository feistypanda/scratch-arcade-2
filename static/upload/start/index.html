<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <!-- http://getbootstrap.com/docs/5.3/ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" type="text/css" href="../../styles.css">
    <link rel="stylesheet" type="text/css" href="../shared.css">
    <link rel="stylesheet" type="text/css" href="./styles.css">
    
    <title>Upload - Scratch Arcade</title>
</head>
<body>

    <h1> Scratch Arcade </h1>

    <main>
        <div id="inputs-container" class="container">
            <div class="section-header-container">
                <h2 class="section-header"> Upload your game: </h2>
            </div>

            <div id="inputs-inner-container" class="form-floating mb-3 input">
                <input type="text" class="form-control" id="link" placeholder="https://scratch.mit.edu/example" autocomplete="off">
                <label for="link">Link to scratch game</label>
                <button id="continue" class="button disabled">Continue</button>
            </div>

            <p id="errors" class="errors"></p>
        </div>

        <div id="instructions-container" class="container">

            <div class="section-header-container">
                <h2 class="section-header"> Arcade Keybinds: </h2>

                <p><b> Make sure that your game uses these controls!</b><br> (You may want to make a copy of your game) </p>
            </div>
            
            <table class="table table-striped">
                <thead>
                    <tr>
                    <th scope="col">ACTION</th>
                    <th scope="col">KEY</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>MOVE UP</td>
                        <td>R</td>
                    </tr>
                    <tr>
                        <td>MOVE LEFT</td>
                        <td>D</td>
                    </tr>
                    <tr>
                        <td>MOVE DOWN</td>
                        <td>F</td>
                    </tr>
                    <tr>
                        <td>MOVE RIGHT</td>
                        <td>G</td>
                    </tr>
                    <tr>
                        <td>RESTART GAME</td>
                        <td>S</td>
                    </tr>
                    <tr>
                        <td>ACTION 1 (eg shoot)</td>
                        <td>A</td>
                    </tr>
                    <tr>
                        <td>ACTION 2 (eg speed boost)</td>
                        <td>W</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>

        const link = document.querySelector('#link');
        const errors = document.querySelector('#errors');
        const btn = document.querySelector('#continue');

        function err (msg) {
            btn.classList.add('disabled')
            errors.innerHTML = msg;
        }

        function runOnChange () {
            let value = link.value;

            if (!value) return err('Enter your link');

            let url;

            try {
                url = new URL(value);
            } catch (e) {
                return err('Invalid URL');
            }

            if (url.hostname !== 'scratch.mit.edu') return err('URL must be from \'scratch.mit.edu\'');

            const pathName = url.pathname.split('/');
            if (pathName[1] !== 'projects' || !pathName[2].match(/^[0-9]+$/)) return err(`Scratch link '${url.toString()}' is not a link to a project`);

            btn.classList.remove('disabled');

            errors.innerHTML = '';

        }

        link.addEventListener("change", runOnChange);
        link.addEventListener("paste", runOnChange);
        link.addEventListener("keyup", runOnChange);
        link.addEventListener("keydown", runOnChange);

        btn.addEventListener('click', function () {
            if (btn.classList.contains('disabled')) return;

            btn.classList.add('disabled');

            const url = new URL(link.value);
            const id = url.pathname.split('/')[2];
            
            return fetch(`/api/get-game-data/${id}`)
                .then(response => response.json())
                .then(data => {
                    if (data.code) {
                        err('Invalid link - Make sure you shared your scratch project so it can be accessed');
                        return btn.classList.remove('disabled');
                    }

                    const redirectUrl = new URL(window.location + '../preview');
                    const params = redirectUrl.searchParams;

                    params.append('link', url.toString());
                    params.append('title', data.title.replaceAll(/^[' ]|[^\w ']| (?= )|'(?=')|[' ]$/g, '').substr(0, 18));
                    params.append('thumbnail', data.image);

                    window.location.href = redirectUrl.toString();
                })

        })
    </script>
</body>

</html>
