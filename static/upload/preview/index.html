<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <!-- http://getbootstrap.com/docs/5.3/ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" type="text/css" href="../styles.css">
    <link rel="stylesheet" type="text/css" href="../../styles.css">
    <link rel="stylesheet" type="text/css" href="./styles.css">

    <title>Upload - Scratch Arcade</title>
</head>
<body>
    <p id="sub-title">Put your scratch game on the</p>
    <h1 id="title">Scratch Arcade!</h1>

    <div id='container'>
        <h2>Upload your game!</h2>

        <div id="step2" class="step">         
            <div id="step2-container">
                <div id="step2-inputs">
                    <p>Edit game title:</p>
                    <div id="title-input-container">
                        <div class="form-floating mb-3 input">
                            <input type="text" class="form-control" id="name" placeholder="Game name" autocomplete="off">
                            <label for="name">Game Title</label>
                        </div>
                        <p id="invalid-feedback"></p>
                    </div>
                    <p>Edit thumbnail:</p>
                    <div class="mb-3 input" id="thumbnail-input">
                        <input type="file" id="thumbnail" placeholder="Game name" autocomplete="off" accept="image/*">
                    </div>
                    <button id="upload-btn" class="disabled">Upload!</button>
                    
                    <p id='errors'></p>
                </div>

                <div id="step2-preview">
                    <div id="preview">
                        <h3 id="preview-title"></h3>
                        <img id="preview-img">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

        let params = new URL(document.location.toString()).searchParams;

        const gameDat = {
            link: params.get('link'),
            name: params.get('title'),
            img: params.get('thumbnail'),
        }

        const errors = document.querySelector('#errors');
        const title = document.querySelector('#name');
        const thumbnail = document.querySelector('#thumbnail');
        const btn = document.querySelector('#upload-btn')
        const previewTitle = document.querySelector('#preview-title');
        const previewImg = document.querySelector('#preview-img');
        const invalidFeedback = document.querySelector('#invalid-feedback');

        title.setAttribute('value', gameDat.name);
        previewImg.setAttribute('src', gameDat.img);

        function err (msg) {
            btn.classList.add('disabled')
            
            title.classList.add('invalid');
            invalidFeedback.style.display = 'block';
            invalidFeedback.innerHTML = msg;
        }

        window.setInterval(function () {

            const name = title.value;

            if (!name || (typeof name) !== 'string') return err('Input your game name');
            if (name.match(/[^\w ']/g)) return err('Name must be alphanumeric');
            if (name.match(/ (?= )/g)) return err('No double spaces');
            if (name.match(/'(?=')/g)) return err('No double apostraphes');
            if (name.match(/^ | $/g)) return err('No leading or trailing spaces');
            if (name.match(/^'|'$/g)) return err('No leading or trailing apostraphes');
            if (name.length < 3) return err('Game name is too short');
            if (name.length > 18) return err('Game name is too long');


            btn.classList.remove('disabled');

            invalidFeedback.style.display = 'none';
            title.classList.remove('invalid');

            gameDat.name = name;
            previewTitle.innerHTML = name;

        }, 50);

        thumbnail.addEventListener('change', () => {
            const file = thumbnail.files[0];

            if (file) {
                gameDat.img = file;

                if (previewImg.src) URL.revokeObjectURL(previewImg.src);
                previewImg.setAttribute('src', URL.createObjectURL(file));
            }
        });

    </script>

    <script>
        function submitFiles () {
            const formData = new FormData();

            const name = document.querySelector('#name');
            const link = document.querySelector('#link');
            const png = document.querySelector('#png');

            formData.append('name', gameDat.name);
            formData.append('link', gameDat.link);
            formData.append('img', gameDat.img);

            const options = {
                method: 'POST',
                body: formData,
            }

            fetch('/api/upload', options).then(response => response.json()).then(dat => {

                if (dat.errors) {
                    errors.style.display = 'block';
                    errors.innerHTML = '<br><h3>Upload failure</h3>' + '- ' + dat.errors.join('<br>- ');
                } else {
                    window.location.replace('/upload/success')
                }
            });
        }

        btn.addEventListener('click', function() {
            if (!btn.classList.contains('disabled')) submitFiles();
        });
    </script>
</body>

</html>
