
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    
    <link rel="stylesheet" type="text/css" href="../styles.css">
    <link rel="stylesheet" type="text/css" href="./styles.css">

    <title>Scratch Arcade</title>
</head>

<body>

    <div id="top-bar">
        <h1 id="title">Scratch Arcade</h1>
    </div>
    <p id="instructions">Use the joystick to navigate through the games, and press the start button to play!</p>

    <div id="container"></div>

    <script>

const main = (() => {

    let gamesElements = [];
    let gameLinks = [];
    let curInd = 0;

    function highlight(index) {

        // Remove border from old
        if(gamesElements[curInd]) gamesElements[curInd].style.border = "10px solid #f7a935";
        
        curInd = index;
        localStorage.setItem('ind', curInd);
        
        // Add border to new
        if(gamesElements[curInd]) {
            gamesElements[curInd].style.border = "10px solid #855cd6";
            scroll(gamesElements[curInd]);
        }
    }

    function getCols() {
        const container = document.getElementById("container");
        const containerWidth = container.clientWidth;
        const itemWidth = gamesElements[0]?.offsetWidth || 200;
        const gap = 20;
        return Math.max(1, Math.round(containerWidth / (itemWidth + gap)));
    }

    function handleNavigation(event) {
        let newInd = curInd;
        const cols = getCols(); 

        if (event.code === "KeyG" && (curInd + 1) % cols !== 0) newInd ++; // Right
        if (event.code === "KeyD" && curInd % cols !== 0) newInd --; // Left
        if (event.code === "KeyF") newInd += cols; // Down
        if (event.code === "KeyR") newInd -= cols; // Up

        // Bounds checking
        if (newInd >= 0 && newInd < gamesElements.length) {
            highlight(newInd);
            return true;
        }

        return false;
    }

    function scroll(el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
        
    function addGamesToPage (games) {

        const container = document.getElementById("container");

        for (let i = 0; i < games.length; i ++) {

            let game = games[i];

            const gameDiv = document.createElement("div");
            gameDiv.classList.add("game-icon");

            const title = document.createElement("h2");
            title.innerText = game.title;
            title.classList.add("game-title");

            const img = document.createElement("img");
            img.src = game.img;
            img.classList.add("game-img");

            gameDiv.appendChild(title);
            gameDiv.appendChild(img);
            container.appendChild(gameDiv);
            
            // Save references for navigation
            gameLinks.push(game.link);
        }
    }

    function storeGamesElements () {
        gamesElements = document.querySelectorAll('.game-icon');
    }

    function highlightLastGame () {
        if (gamesElements.length <= 0) return;
        highlight (+localStorage.getItem("ind") || 0);
    }

    function setupKeyListener () {
        document.addEventListener("keydown", event => {
            handleNavigation(event);

            if (event.code === "KeyS" && gameLinks[curInd]) window.open(gameLinks[curInd], '_self');
        });
    }

    return function main (games) {
        addGamesToPage(games);
        storeGamesElements();
        highlightLastGame();
        setupKeyListener();
    }
})();

// fetch the data generated by Python
fetch('./games.json')
    .then(response => response.json())
    .then(main)
    .catch(err => console.error("Run the Python script first to generate games.json!", err));

    </script>
</body>
</html>
